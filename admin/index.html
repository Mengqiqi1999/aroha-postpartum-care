<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aroha Postpartum Care — Content Admin</title>
</head>
<body>
  <!-- config.yml in this same folder tells Decap CMS which GitHub repo to edit and what the
       editable fields are (generated from content/*.json — one collection per website section). -->
  <script>
    // Loaded dynamically (rather than a plain <script src>) because on some browsers a
    // synchronous script tag parsed during the initial page load silently fails to run
    // decap-cms.js (a browser extension race, not a bug in the CMS itself) — appending
    // the tag ourselves after the page has settled reliably avoids that.
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js';
    document.body.appendChild(s);
  </script>
</body>
</html>
